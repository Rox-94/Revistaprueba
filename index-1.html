<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mini Revista VIEX 2025 - Configuración Simple (Final)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0; 
            font-family: sans-serif;
            background-color: #f4f4f4;
            height: 100vh;
        }

        /* Contenedor principal: Centra la revista */
        #container {
            position: relative;
            width: 100%;
            /* Ajustado para acomodar la página doble (1225px) en una sola vista */
            max-width: 1260px; 
            height: 90vh; 
            margin: 5vh auto; 
            overflow: hidden; 
        }

        #flipbook {
            width: 100%;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden; 
        }

        .page {
            width: 100%; 
            height: 100%; 
            background: white;
            overflow: hidden !important; 
        }
        
        iframe {
            display: block; 
            box-sizing: border-box;
            border: none;
            /* Se mantiene el ancho de 1225px, ya que es el tamaño de la página doble interna */
            width: 1225px !important; 
            height: 792px !important; 
        }

        h1 { text-align: center; color: #2c3e50; margin-top: 20px; }
        .controls { text-align: center; margin-top: 20px; }
        .control-button { 
            font-size: 16px; padding: 10px 20px; margin: 0 10px; cursor: pointer;
            border: 1px solid #ccc; background-color: #fff; border-radius: 5px; 
            transition: background-color 0.2s;
        }
        .control-button:hover { background-color: #e0e0e0; }

        .nav-button {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6); color: white; border: none;
            padding: 15px 15px; font-size: 24px; cursor: pointer;
            z-index: 100; /* Asegura que los botones estén encima */
            transition: background 0.3s; line-height: 0; border-radius: 5px;
        }
        /* Posición de los botones arreglada */
        #prev-page { left: 0px; } 
        #next-page { right: 0px; }
        
        @media (max-width: 1300px) { 
            #container { max-width: 95%; margin: 5vh auto; }
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/turn.js"></script> 
</head>
<body>
    <h1>🌎 Escuela Internacional de Verano 2025 ✨</h1>

    <div id="container">
        <button class="nav-button" id="prev-page" onclick="prevPage()">&#10094;</button> 
        
        <div id="flipbook">
            <div class="page"><iframe src="publication-web-resources/html/publication.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-1.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-2.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-3.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-4.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-5.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-6.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-7.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-8.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-9.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-10.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-11.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-12.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
            <div class="page"><iframe src="publication-web-resources/html/publication-13.html" style="width:100%; height:100%; overflow: hidden;" scrolling="no"></iframe></div>
        </div>

        <button class="nav-button" id="next-page" onclick="nextPage()">&#10095;</button> 
    </div>
    
    <div class="controls">
        <button class="control-button" onclick="zoomIn()">Zoom +</button>
        <button class="control-button" onclick="zoomOut()">Zoom -</button>
        <button class="control-button" onclick="toggleFullscreen()">Pantalla Completa</button>
    </div>

    <script>
        window.prevPage = function() { $("#flipbook").turn("previous"); }
        window.nextPage = function() { $("#flipbook").turn("next"); }

        window.zoomIn = function() {
          var flipbook = document.getElementById('flipbook');
          var currentScale = flipbook.style.transform ? parseFloat(flipbook.style.transform.replace(/[^\d.]/g, '')) : 1;
          flipbook.style.transform = 'scale(' + (currentScale + 0.1) + ')';
          flipbook.style.transformOrigin = 'center center';
        }

        window.zoomOut = function() {
          var flipbook = document.getElementById('flipbook');
          var currentScale = flipbook.style.transform ? parseFloat(flipbook.style.transform.replace(/[^\d.]/g, '')) : 1;
          if (currentScale > 0.6) flipbook.style.transform = 'scale(' + (currentScale - 0.1) + ')';
          flipbook.style.transformOrigin = 'center center';
        }

        window.toggleFullscreen = function() {
            var elem = document.getElementById('container');
            
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) { elem.requestFullscreen(); } 
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
                else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); } 
                else if (document.webkitExitFullscreen) { elem.webkitExitFullscreen(); } 
                else if (elem.msExitFullscreen) { elem.msExitFullscreen(); }
            }
        }

        $(document).ready(function() {
            try {
                $("#flipbook").turn({
                    width: 1225, 
                    height: 792, 
                    // 🚨 CAMBIO CLAVE: Usamos 'single' porque cada HTML ya es la página doble.
                    display: 'single', 
                    autoCenter: true,
                    gradients: true,
                    direction: 'ltr'
                    // No necesitamos la lógica condicional 'when'
                });
            } catch (error) {
                console.log("Error al inicializar Turn.js: " + error);
            }
        });
    </script>
</body>
</html>
